<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeSecure OPS Dashboard</title><link rel="stylesheet" href="styles.css"></head><body>
<header><span class="brand">HomeSecure OPS Dashboard</span><div class="header-actions"><span id="live-status">● Live</span><a class="button" href="ops-form.html">+ Add Booking</a></div></header>
<main class="stage">
<section class="scene active" data-scene="countdown"><div class="scene-title"><div><span class="eyebrow">Live Operations</span><h1>Current Booking Countdown</h1></div><div class="scene-nav"><span>1 / 2</span><button class="next-screen" aria-label="Next screen">→</button></div></div><div id="countdown-meta" class="meta">Awaiting countdown setup</div><div id="countdown-cards" class="cards countdown-cards"></div><section class="agent-panel"><h2>Current Countdown by Agent</h2><div class="table-wrap"><table><thead><tr><th>Agent</th><th>Sales Tracker</th><th>Service Jobs</th><th>Upgrades</th><th>Total</th></tr></thead><tbody id="agent-table"></tbody></table></div></section></section>
<section class="scene" data-scene="mtd"><div class="scene-title"><div><span class="eyebrow">Management Snapshot</span><h1>Month-to-Date Position</h1></div><div class="scene-nav"><span>2 / 2</span><button class="next-screen" aria-label="Next screen">→</button></div></div><div id="mtd-meta" class="meta">Awaiting manual MTD update</div><div id="mtd-cards" class="cards mtd-cards"></div></section>
</main>
<div id="booking-notification" class="booking-notification" aria-hidden="true"><div class="notification-card"><span>Booking Recorded</span><strong id="notification-type"></strong><p id="notification-detail"></p><b id="notification-remaining"></b></div></div>
<script type="module" src="js/dashboard.js"></script></body></html>
